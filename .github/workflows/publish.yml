name: github pages
on:
  push:
    branches:
      - main
    paths:
      - trees/**
      - assets/**
      - theme/**
      - tests/**
      - forest.toml
      - Makefile
      - .github/workflows/publish.yml
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      OCAML_VERSION: "5.3.0"
      FORESTER_VERSION: "5.0"
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 1

      - name: "Set-up OCaml"
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      # setup-ocaml deliberately caches only the base compiler switch, not
      # packages installed later in the job. Keep a separate, versioned cache
      # for the switch after Forester has been installed.
      - name: Restore Forester opam switch
        uses: actions/cache@v5
        with:
          path: _opam
          key: forester-opam-v1-${{ runner.os }}-${{ runner.arch }}-ocaml-${{ env.OCAML_VERSION }}-forester-${{ env.FORESTER_VERSION }}

      - name: Install Forester system dependencies
        run: sudo apt-get install -y libev-dev

      - name: Install Forester on cache miss
        run: |
          if opam exec -- forester --help >/dev/null 2>&1; then
            echo "Using Forester restored from the explicit opam switch cache."
          else
            git clone --branch "$FORESTER_VERSION" --depth 1 \
              https://git.sr.ht/~jonsterling/ocaml-forester
            opam pin add -y ./ocaml-forester
          fi

      - name: "Setup TeX Live"
        uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: >-
            scheme-medium
            standalone
            mlmodern
            amsfonts
            amsmath
            zx-calculus
            tikz-cd
            l3packages
            dvisvgm
            pgf
            etoolbox
            mathtools
            stmaryrd
            newtx
            newpx
            xstring
            xpatch
            fontaxes
            kastrup
            spath3

      - name: "Check `tlmgr` version"
        run: tlmgr --version

      - name: "Build forest"
        run: make release

      - name: "Deploy"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
